name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:hash-routing
      - run: npm run validate:source-renderer
      - run: npm run validate:sort-names
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hash-routing:e2e
      - run: npm run test:source-renderer:e2e
