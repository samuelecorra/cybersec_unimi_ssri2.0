name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:hash-routing
      - run: npm run validate:source-renderer
      - run: npm run validate:sort-names
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hash-routing:e2e
      - run: npm run test:source-renderer:e2e
