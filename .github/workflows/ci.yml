name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:hash-routing
      - run: npm run validate:source-renderer
      - run: npm run validate:sort-names
      - run: npm run build
      - run: npm run test:hash-routing:e2e
      - run: npm run test:source-renderer:e2e
